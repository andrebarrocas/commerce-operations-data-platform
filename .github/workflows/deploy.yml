name: deliberate-aws-deployment
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        default: plan
        description: Plan only unless deliberately applying billable infrastructure
      state_bucket:
        type: string
        required: true
        description: Existing private encrypted versioned state bucket in selected region
      region:
        type: string
        default: eu-west-1
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: commerce-aws-deployment
  cancel-in-progress: false
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: portfolio-aws
    env:
      TF_VAR_aws_region: ${{ inputs.region }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.13.1'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - run: python scripts/package_lambda.py
      - name: Configure persistent state
        env:
          STATE_BUCKET: ${{ inputs.state_bucket }}
          STATE_REGION: ${{ inputs.region }}
        run: |
          cat > infra/backend.tf <<'BACKEND'
          terraform { backend "s3" {} }
          BACKEND
          tofu -chdir=infra init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=commerce-platform/dev.tfstate" \
            -backend-config="region=$STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra plan -input=false -out=deployment.tfplan
      - if: inputs.operation == 'apply'
        run: tofu -chdir=infra apply -input=false deployment.tfplan
