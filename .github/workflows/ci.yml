name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -c requirements.lock -e '.[dev,aws]'
      - run: make check
  spark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -c requirements.lock -e '.[dev,spark]'
      - run: make spark-test
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.13.1'
      - run: python scripts/package_lambda.py
      - name: Import packaged Linux validation runtime
        run: |
          python -m zipfile -e dist/lambda.zip var/lambda-check
          cd var/lambda-check
          python -c 'import lambda_handler; from commerce_platform.validation import validate_event; assert validate_event({})'
      - run: tofu -chdir=infra fmt -check
      - run: tofu -chdir=infra init -backend=false
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra/acceptance fmt -check
      - run: tofu -chdir=infra/acceptance init -backend=false
      - run: tofu -chdir=infra/acceptance validate
