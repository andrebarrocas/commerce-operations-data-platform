[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-operations-platform"
version = "0.1.0"
description = "Independent synthetic commerce data engineering portfolio"
requires-python = ">=3.11,<3.13"
dependencies = ["duckdb>=1.2,<2", "pyarrow>=18,<24", "jsonschema[format]>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema"]
aws = ["boto3>=1.37,<2"]
spark = ["pyspark==3.5.7"]

[project.scripts]
commerce = "commerce_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: requires Java 17 and PySpark", "integration: local end to end"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/commerce_platform"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
